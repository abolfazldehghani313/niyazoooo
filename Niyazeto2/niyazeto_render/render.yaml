services:
  - type: web
    name: niyazeto-test-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: niyazeto-test-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: niyazeto_admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DEV_OTP_MODE
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
      - key: UPLOAD_DIR
        value: /opt/render/project/src/uploads

databases:
  - name: niyazeto-test-db
    plan: free
    databaseName: niyazeto
    user: niyazeto
